<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prefer Simplified Chinese glyphs over JP/KR for unlabeled CJK text (e.g. Anki). See https://en.wikipedia.org/wiki/Han_unification -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
